name: azodha
description: "Flutter widget recording comparison: widget_recorder_plus vs a custom hybrid screenshot+timeline approach vs Microsoft Clarity."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Architecture
  get_it: ^8.0.3
  provider: ^6.1.5
  equatable: ^2.0.8

  # Shared plumbing
  path_provider: ^2.1.5
  intl: ^0.19.0
  url_launcher: ^6.3.1
  image: ^4.2.0

  # Approach A: widget_recorder_plus
  widget_recorder_plus: ^1.0.5

  # Approach C: Microsoft Clarity
  clarity_flutter: ^1.9.0

  # Google Drive upload
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^17.0.0
  font_awesome_flutter: ^11.0.0
  archive: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
